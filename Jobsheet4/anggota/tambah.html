</head>

<body>
      <header class="navbar navbar-expand-md navbar-dark" style="background-color: #1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">

                <li class="nav-item"><a class="nav-link" href="../buku/list.html">Daftar Buku</a></li>
                <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Anggota</a></li>
                <li class="nav-item"><a class="nav-link" href="list.html">Daftar Anggota</a></li>

            </ul>
        </nav>
        </div>
    </header>

    <main>
        <section>
            <span>* (wajib diisi)</span>
            <h2 class="text-primary">Tambah Anggota</h2>
            <form>
                <p>
                    <label for="nama">Nama</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="no_anggota">No Anggota</label><br>
                    <input type="text" id="no_anggota" name="no_anggota" required>
                </p>
                <p>
                    <label for="alamat">Alamat</label><br>
                    <textarea name="alamat" id="alamat" rows="10" cols="30"></textarea>
                    <input type="text" id="alamat" name="alamat">
                </p>
                <p>
                    <label for="tanggal_lahir">Tangga Lahir</label><br>
                    <input type="datetime-local" value="dd/mm/yyyy hh:mm:ss" id="tanggal_lahir">
                </p>
                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="number" id="no_hp" name="no_hp">
                </p>
                <p>
                    <button type="submit" class="btn btn-primary">Simpan</button>
                </p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
