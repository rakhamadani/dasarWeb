<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Login - SIMPUS-Mini</title>
</head>

<body align="center">
    <div class="row g-3 text-center">
        <header class="row g-3 text-center" style="background-color: #1d5b8a;">
            <h1>SIMPUS-Mini</h1>
        </header>

        <main class="container my-4">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card-body" style="background-color: #1a5b8a;">
                        <section class="card shadow-sm mb-4">
                            <h2>Login Petugas</h2>
                            <form action="dashboard.html" method="POST">
                                <div class="col-11">
                                    <div class="card-body" style="color: #1a5b8a;">
                                        <label for="username">Username: <span class="text-danger">*</span></label>
                                        <input type="text" id="username" name="username"
                                            placeholder="Masukkan username Anda" required>
                                    </div>
                                </div>

                                <br>

                                <div class="col-11">
                                    <div class="card-body" style="color: #1a5b8a;">
                                        <label for="password">Password: <span class="text-danger">*</span></label>
                                        <input type="password" id="password" name="password"
                                            placeholder="Masukkan password" required minlength="6">
                                    </div>

                                    <br>
                                    <div>
                                        <button type="submit" class="btn btn-primary" style="background-color: #1a5b8a; color: aliceblue;">Masuk</button>
                                    </div>
                                </div>
                            </form>

                            <br>

                            <div>
                                Belum punya akun? <a href="daftar.html">Daftar di sini</a>
                            </div>
                    </div>
                </div>
            </div>
            </section>
        </main>

</body>

</html>
